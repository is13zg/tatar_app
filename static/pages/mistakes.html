<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Работа над ошибками — TT-Learn Kids</title>
  <style>
    :root { --maxw: 640px; }
    body { font-family: system-ui, sans-serif; margin: 0; }
    nav { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; }
    nav a { text-decoration: none; color: #2563eb; }
    .wrap { min-height: calc(100dvh - 50px); display: grid; place-items: center; padding: 16px; }
    .card { width: 100%; max-width: var(--maxw); border: 1px solid #e5e7eb; padding: 16px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .center { display: grid; justify-items: center; gap: 12px; text-align: center; }
    select, button { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #d1d5db; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
    .tile { border: 1px solid #e5e7eb; border-radius: 12px; padding: 6px; display: grid; place-items: center; background: white; }
    .img { width: 100%; max-width: 220px; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; }
    .play { width: 48px; height: 48px; border-radius: 999px; border: 1px solid #d1d5db; display: grid; place-items: center; cursor: pointer; background: white; }
    .play:after { content: ''; border-left: 12px solid #111; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; }
    .good { color: #16a34a; font-weight: 600; }
    .bad { color: #ef4444; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <a href="/static/pages/study.html">Изучение</a>
    <a href="/static/pages/repeat.html">Повторение</a>
    <a href="/static/pages/mistakes.html">Работа над ошибками</a>
    <a href="/static/pages/stats.html">Статистика</a>
    <a href="/static/pages/login.html" id="logout">Выход</a>
  </nav>

  <div class="wrap">
    <div class="card">
      <div id="screen" class="center"></div>
    </div>
  </div>

  <audio id="audio-word"></audio>
  <audio id="audio-good" src="/static/sounds/success.mp3"></audio>
  <audio id="audio-bad" src="/static/sounds/error.mp3"></audio>

  <script>
    function token() { return localStorage.getItem('token'); }
    function authHeaders() { const t = token(); return t ? { 'Authorization': 'Bearer ' + t } : {}; }
    if (!token()) location.href = '/static/pages/login.html';

    async function api(path, opts={}) {
      const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(opts.headers||{}) } });
      if (!res.ok) throw new Error(await res.text());
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return res.json();
      return res.text();
    }

    function tts(text) { /* отключено: браузерный голос читал татарский неверно */ }
    function playWordAudio(url, fallbackText) {
      const a = document.getElementById('audio-word');
      try { a.pause(); a.currentTime = 0; } catch {}
      if (url) { a.src = url; a.play().catch(() => { if (fallbackText) tts(fallbackText); }); }
      else if (fallbackText) { tts(fallbackText); }
    }

    function playFx(ok) {
      const good = document.getElementById('audio-good');
      const bad = document.getElementById('audio-bad');
      try { good.pause(); good.currentTime = 0; bad.pause(); bad.currentTime = 0; } catch {}
      good.volume = 0.5; bad.volume = 0.5;
      (ok ? good : bad).play().catch(() => {});
    }

    function playFxAsync(ok) {
      return new Promise(resolve => {
        const good = document.getElementById('audio-good');
        const bad = document.getElementById('audio-bad');
        try { good.pause(); good.currentTime = 0; bad.pause(); bad.currentTime = 0; } catch {}
        good.volume = 0.5; bad.volume = 0.5;
        const el = ok ? good : bad;
        el.onended = () => { el.onended = null; resolve(); };
        el.play().catch(() => resolve());
      });
    }

    async function startMistakes() {
      const quiz = await api('/modes/mistakes');
      let idx = 0, good = 0, bad = 0;

      if (!quiz.length) { const s = document.getElementById('screen'); s.textContent = 'Ошибок нет!'; return; }

      const next = () => {
        if (idx >= quiz.length) { return showResult(); }
        const item = quiz[idx++];
        renderQuestion(item);
      };

      function showResult() {
        const screen = document.getElementById('screen'); screen.innerHTML = '';
        const res = document.createElement('div'); res.innerHTML = `Верно: <span class="good">${good}</span> · Ошибок: <span class="bad">${bad}</span>`;
        const again = document.createElement('button'); again.textContent = 'Повторить заново'; again.onclick = () => startMistakes();
        screen.appendChild(res); screen.appendChild(again);
      }

      function renderQuestion(item) {
        const screen = document.getElementById('screen'); screen.innerHTML = '';
        const tt = document.createElement('div'); tt.style.fontSize = '22px'; tt.style.fontWeight = '700'; tt.textContent = item.text_tt;
        const play = document.createElement('div'); play.className = 'play'; play.title = 'Произнести'; play.onclick = () => playWordAudio(item.audio_url, item.text_tt);
        const grid = document.createElement('div'); grid.className = 'grid';
        let answered = false;
        item.options.forEach(opt => {
          const tile = document.createElement('button'); tile.className = 'tile';
          const img = document.createElement('img'); img.className = 'img'; img.src = opt.image_url || '/static/noimg.png';
          tile.appendChild(img);
          tile.onclick = async () => {
            if (answered) return; answered = true; grid.style.pointerEvents = 'none';
            const correct = String(opt.id) === String(item.word_id);
            await api('/modes/answer', { method: 'POST', body: JSON.stringify({ word_id: item.word_id, is_correct: correct }) });
            const fb = document.createElement('div');
            fb.className = correct ? 'good' : 'bad';
            fb.textContent = correct ? 'Дөрес' : 'Хата';
            screen.appendChild(fb);
            await playFxAsync(correct);
            if (correct) good++; else bad++;
            next();
          };
          grid.appendChild(tile);
        });
        screen.appendChild(tt); screen.appendChild(play); screen.appendChild(grid);
        playWordAudio(item.audio_url, item.text_tt);
      }

      next();
    }

    document.getElementById('logout').onclick = () => { localStorage.removeItem('token'); localStorage.removeItem('username'); };

    startMistakes();
  </script>
</body>
</html>
