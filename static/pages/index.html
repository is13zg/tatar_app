<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TT-Learn Kids</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    img { max-width: 160px; max-height: 160px; object-fit: cover; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .hidden { display: none; }
    button { padding: 8px 12px; }
    .mode { margin-top: 16px; }
    input, select { padding: 6px; }
  </style>
</head>
<body>
  <h1>TT-Learn Kids</h1>
  <div class="card">
    <div class="row">
      <input id="username" placeholder="Логин" />
      <input id="password" type="password" placeholder="Пароль" />
      <button id="btnRegister">Регистрация</button>
      <button id="btnLogin">Войти</button>
      <span id="authInfo"></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <label>Тема:</label>
      <select id="themes"></select>
      <button id="btnLoad">Загрузить</button>
    </div>
  </div>

  <div class="card mode">
    <h2>Режим изучения</h2>
    <div id="study"></div>
  </div>

  <div class="card mode">
    <h2>Режим повторения</h2>
    <div id="repeat"></div>
  </div>

  <div class="card mode">
    <h2>Работа над ошибками</h2>
    <div id="mistakes"></div>
  </div>

  <script>
    const state = { token: null, themeId: null, voicesReady: false };

    function setAuthInfo(text) { document.getElementById('authInfo').textContent = text; }
    function getAuthHeaders() { return state.token ? { 'Authorization': 'Bearer ' + state.token } : {}; }

    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...getAuthHeaders(), ...(opts.headers||{}) } });
      if (!res.ok) throw new Error(await res.text());
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return res.json();
      return res.text();
    }

    // Auth
    document.getElementById('btnRegister').onclick = async () => {
      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        await api('/auth/register', { method: 'POST', body: JSON.stringify({ username, password }) });
        setAuthInfo('Регистрация успешна. Теперь войдите.');
      } catch (e) { alert(e); }
    };
    document.getElementById('btnLogin').onclick = async () => {
      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const body = new URLSearchParams({ username, password, grant_type: '' });
        const res = await fetch('/auth/login', { method: 'POST', headers: getAuthHeaders(), body });
        const data = await res.json();
        state.token = data.access_token; setAuthInfo('Вошли как ' + username);
        await loadThemes();
      } catch (e) { alert('Ошибка входа'); }
    };

    async function loadThemes() {
      const themes = await api('/themes');
      const sel = document.getElementById('themes');
      sel.innerHTML = '';
      themes.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id; opt.textContent = t.title_ru; sel.appendChild(opt);
      });
      if (themes.length) state.themeId = themes[0].id;
    }

    document.getElementById('btnLoad').onclick = async () => {
      const sel = document.getElementById('themes');
      state.themeId = Number(sel.value);
      await renderStudy();
      await renderRepeat();
      await renderMistakes();
    };

    function speak(text) {
      try {
        const utter = new SpeechSynthesisUtterance(text);
        // Пользователь может выбрать другой татарский голос при наличии
        speechSynthesis.speak(utter);
      } catch {}
    }

    async function renderStudy() {
      const cont = document.getElementById('study');
      cont.innerHTML = '';
      if (!state.token) { cont.textContent = 'Войдите, чтобы начать.'; return; }
      const words = await api(`/themes/${state.themeId}/words`);
      words.forEach(w => {
        const block = document.createElement('div');
        block.className = 'row';
        const img = document.createElement('img'); img.src = w.image_url || '/static/noimg.png';
        const caption = document.createElement('div'); caption.textContent = `${w.text_tt} — ${w.text_ru}`;
        const btn = document.createElement('button'); btn.textContent = 'Произнести'; btn.onclick = () => speak(w.text_tt);
        block.appendChild(img); block.appendChild(caption); block.appendChild(btn);
        cont.appendChild(block);
      });
    }

    async function renderRepeat() {
      const cont = document.getElementById('repeat');
      cont.innerHTML = '';
      if (!state.token) { cont.textContent = 'Войдите, чтобы начать.'; return; }
      try {
        const quiz = await api(`/modes/repeat/${state.themeId}`);
        quiz.forEach(item => {
          const card = document.createElement('div'); card.className = 'card';
          const title = document.createElement('div'); title.textContent = `Выбери картинку: ${item.text_tt}`;
          const grid = document.createElement('div'); grid.className = 'grid';
          item.options.forEach(opt => {
            const b = document.createElement('button');
            const img = document.createElement('img'); img.src = opt.image_url || '/static/noimg.png';
            b.appendChild(img);
            b.onclick = async () => {
              const correct = String(opt.id) === String(item.word_id);
              await api('/modes/answer', { method: 'POST', body: JSON.stringify({ word_id: item.word_id, is_correct: correct }) });
              card.remove();
            };
            grid.appendChild(b);
          });
          card.appendChild(title); card.appendChild(grid); cont.appendChild(card);
        });
      } catch (e) { cont.textContent = 'Недостаточно слов для повторения.'; }
    }

    async function renderMistakes() {
      const cont = document.getElementById('mistakes');
      cont.innerHTML = '';
      if (!state.token) { cont.textContent = 'Войдите, чтобы начать.'; return; }
      const quiz = await api('/modes/mistakes');
      if (!quiz.length) { cont.textContent = 'Ошибок нет!'; return; }
      quiz.forEach(item => {
        const card = document.createElement('div'); card.className = 'card';
        const title = document.createElement('div'); title.textContent = `Повтори: ${item.text_tt}`;
        const grid = document.createElement('div'); grid.className = 'grid';
        item.options.forEach(opt => {
          const b = document.createElement('button');
          const img = document.createElement('img'); img.src = opt.image_url || '/static/noimg.png';
          b.appendChild(img);
          b.onclick = async () => {
            const correct = String(opt.id) === String(item.word_id);
            await api('/modes/answer', { method: 'POST', body: JSON.stringify({ word_id: item.word_id, is_correct: correct }) });
            card.remove();
          };
          grid.appendChild(b);
        });
        card.appendChild(title); card.appendChild(grid); cont.appendChild(card);
      });
    }

    // Preload themes for anonymous to show list, login needed to play
    loadThemes();
  </script>
</body>
</html>
