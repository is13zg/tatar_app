<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — TT-Learn Kids</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
  <style>
    :root { --maxw: 420px; }
    body { font-family: system-ui, sans-serif; margin: 0; }
    .center { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
    .card { width: 100%; max-width: var(--maxw); border: 1px solid #e5e7eb; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    h1 { margin: 0 0 16px; text-align: center; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    input { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    button { padding: 12px; border: 0; background: #22c55e; color: white; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .link { text-align: center; margin-top: 12px; }
    a { color: #2563eb; text-decoration: none; }
    .msg { margin-top: 8px; min-height: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <div class="center">
    <div class="card">
      <h1>Регистрация</h1>
      <form id="regForm">
      <div class="field">
        <label for="reg_username">Логин</label>
        <input id="reg_username" placeholder="Логин" autocomplete="username" />
      </div>
      <div class="field">
        <label for="reg_password">Пароль</label>
        <input id="reg_password" type="password" placeholder="Пароль" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="reg_password_confirm">Подтвердите пароль</label>
        <input id="reg_password_confirm" type="password" placeholder="Подтвердите пароль" autocomplete="new-password" />
      </div>
      <button id="btnRegister" type="submit">Зарегистрироваться</button>
      </form>
      <div class="msg" id="regInfo"></div>
      <div class="link"><a href="/static/pages/login.html">Уже есть аккаунт? Войти</a></div>
    </div>
  </div>

  <script>
    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) } });
      if (!res.ok) throw new Error(await res.text());
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return res.json();
      return res.text();
    }

    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg_username').value.trim();
      const password = document.getElementById('reg_password').value.trim();
      const password_confirm = document.getElementById('reg_password_confirm').value.trim();
      const info = document.getElementById('regInfo');
      info.textContent = '';
      if (!username || !password || !password_confirm) { info.textContent = 'Заполните все поля'; return; }
      if (password !== password_confirm) { info.textContent = 'Пароли не совпадают'; return; }
      try {
        await api('/auth/register', { method: 'POST', body: JSON.stringify({ username, password, password_confirm }) });
        // сразу входим и ведём на детскую главную — без лишнего шага
        const body = new URLSearchParams({ username, password, grant_type: '' });
        const res = await fetch('/auth/login', { method: 'POST', body });
        const data = await res.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('username', username);
        location.href = '/static/pages/home.html';
      } catch (e) {
        info.style.color = '#ef4444';
        let msg = 'Ошибка регистрации';
        try { msg = JSON.parse(e.message).detail || msg; } catch (_) {}
        info.textContent = typeof msg === 'string' ? msg : 'Проверьте логин и пароль';
      }
    };
  </script>
</body>
</html>
