<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Словарик — TT-Learn Kids</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
  <link rel="stylesheet" href="/static/kid.css?v=20260812a" />
  <style>
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .theme-card {
      background: var(--card); border: none; border-radius: 20px; padding: 14px 8px;
      box-shadow: var(--shadow); cursor: pointer; display: grid; gap: 4px; justify-items: center;
    }
    .theme-card .ic { font-size: 44px; line-height: 1.1; }
    .theme-card .tt { font-weight: 800; font-size: 16px; text-align: center; }
    .theme-card .sub { color: #6b7280; font-size: 13px; }
    .nav-row { display: flex; gap: 12px; margin-top: 14px; width: 100%; }
    .nav-row .kid-btn { font-size: 20px; padding: 14px; }
    .counter { text-align: center; color: #6b7280; font-weight: 700; margin-top: 8px; }
    .sent { text-align: center; margin-top: 10px; background: #fff7ed; border-radius: 14px; padding: 10px 14px; }
    .sent .l1 { font-size: 19px; font-weight: 600; }
    .sent .l1 b { color: #ea580c; }
    .sent .l2 { font-size: 14px; color: #92400e; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="kid-wrap">
    <div class="kid-top">
      <button class="kid-back" onclick="goBack()">←</button>
      <div class="kid-chip">📖 Словарик</div>
    </div>
    <div class="kid-card" id="screen"></div>
  </div>

  <audio id="player"></audio>
  <script>
    function token() { return localStorage.getItem('token'); }
    if (!token()) location.href = '/static/pages/login.html';
    async function api(path) {
      const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token() } });
      if (res.status === 401) { location.href = '/static/pages/login.html'; throw new Error('401'); }
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    const player = document.getElementById('player');
    function play(url) { if (!url) return; try { player.pause(); player.currentTime = 0; } catch (e) {} player.src = url; player.play().catch(() => {}); }

    let mode = 'themes', words = [], idx = 0;
    function goBack() {
      if (mode === 'word') { mode = 'themes'; showThemes(); }
      else location.href = '/static/pages/home.html';
    }

    let themesCache = [];
    async function showThemes() {
      const s = document.getElementById('screen');
      s.innerHTML = '';
      if (!themesCache.length) themesCache = await api('/themes');
      const grid = document.createElement('div'); grid.className = 'theme-grid';
      themesCache.forEach(t => {
        const c = document.createElement('button'); c.className = 'theme-card';
        const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = t.icon_emoji || '📚';
        const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = t.title_ru;
        const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = t.title_tt || '';
        c.appendChild(ic); c.appendChild(tt); c.appendChild(sub);
        c.onclick = () => openTheme(t.id);
        grid.appendChild(c);
      });
      s.appendChild(grid);
    }

    async function openTheme(themeId) {
      words = await api(`/themes/${themeId}/words`);
      if (!words.length) return;
      idx = 0; mode = 'word';
      showWord();
    }

    function showWord() {
      const s = document.getElementById('screen');
      s.innerHTML = '';
      const w = words[idx];
      const vis = document.createElement('div'); vis.className = 'big-visual';
      if (w.image_url && !w.image_url.includes('noimg')) {
        const img = document.createElement('img'); img.src = w.image_url; vis.appendChild(img);
      } else {
        const em = document.createElement('div'); em.className = 'emoji'; em.textContent = w.emoji || '❓'; vis.appendChild(em);
      }
      s.appendChild(vis);
      const big = document.createElement('div'); big.className = 'word-big'; big.textContent = w.text_tt;
      if (w.text_tt.length > 14) big.style.fontSize = '24px';
      s.appendChild(big);
      const small = document.createElement('div'); small.className = 'word-small'; small.textContent = w.text_ru;
      s.appendChild(small);
      if (w.sentence_tt) {
        const box = document.createElement('div'); box.className = 'sent';
        const l1 = document.createElement('div'); l1.className = 'l1';
        const i = w.sentence_tt.toLowerCase().indexOf(w.text_tt.toLowerCase());
        if (i >= 0) {
          l1.appendChild(document.createTextNode(w.sentence_tt.slice(0, i)));
          const b = document.createElement('b'); b.textContent = w.sentence_tt.slice(i, i + w.text_tt.length);
          l1.appendChild(b);
          l1.appendChild(document.createTextNode(w.sentence_tt.slice(i + w.text_tt.length)));
        } else l1.textContent = w.sentence_tt;
        box.appendChild(l1);
        if (w.sentence_ru) { const l2 = document.createElement('div'); l2.className = 'l2'; l2.textContent = w.sentence_ru; box.appendChild(l2); }
        s.appendChild(box);
      }
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap;';
      const pw = document.createElement('button'); pw.className = 'play-btn'; pw.textContent = '🔊'; pw.title = 'Слово';
      pw.onclick = () => play(w.audio_url || w.tts_url);
      row.appendChild(pw);
      if (w.sentence_audio_url) {
        const ps = document.createElement('button'); ps.className = 'play-btn'; ps.textContent = '💬'; ps.title = 'Предложение';
        ps.style.background = '#0ea5e9';
        ps.onclick = () => play(w.sentence_audio_url);
        row.appendChild(ps);
      }
      s.appendChild(row);
      const nav = document.createElement('div'); nav.className = 'nav-row';
      const prev = document.createElement('button'); prev.className = 'kid-btn ghost'; prev.textContent = '⬅';
      prev.disabled = idx === 0;
      prev.onclick = () => { idx--; showWord(); };
      const next = document.createElement('button'); next.className = 'kid-btn'; next.textContent = idx === words.length - 1 ? '✔ Готово' : '➡';
      next.onclick = () => { if (idx === words.length - 1) { mode = 'themes'; showThemes(); } else { idx++; showWord(); } };
      nav.appendChild(prev); nav.appendChild(next);
      s.appendChild(nav);
      const counter = document.createElement('div'); counter.className = 'counter';
      counter.textContent = `${idx + 1} из ${words.length}`;
      s.appendChild(counter);
      play(w.audio_url || w.tts_url);
    }

    showThemes();
  </script>
</body>
</html>
