<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Просмотр упражнения — TT-Learn Kids</title>
  <link rel="stylesheet" href="/static/kid.css?v=20260812c">
  <script src="/static/exercises.js?v=20260817a"></script>
</head>
<body>
<!-- Служебная страница для админа: рисует ОДНО задание нужного типа из живого
     урока, не проходя урок целиком. Нужна, чтобы смотреть глазами новые
     форматы (сцену послелогов, счёт, «сейчас или уже»), где вёрстка своя.
     Открывать так: _preview_ex.html?theme=38&type=where -->
<div class="kid-wrap">
  <div id="screen" class="kid-screen"></div>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const theme = q.get('theme') || '38';
  const type = q.get('type') || 'where';
  const screen = document.getElementById('screen');
  const say = (html) => { screen.innerHTML = '<div class="instr">' + html + '</div>'; };

  const token = localStorage.getItem('token');
  if (!token) {
    // раньше страница молча писала «задание не встретилось» — на деле её просто
    // никто не пускал к API, и это отправляло искать несуществующую поломку
    say('Сначала нужно войти.<br><br><a class="kid-btn" href="/static/pages/login.html?next=' +
        encodeURIComponent(location.pathname + location.search) + '">Войти</a>');
    return;
  }

  let found = null, status = 0, tried = 0;
  for (let lesson = 1; lesson <= 8 && !found; lesson++) {
    for (let tries = 0; tries < 12 && !found; tries++) {
      const r = await fetch('/lesson/unit/' + theme + '/' + lesson, { headers: { Authorization: 'Bearer ' + token } });
      status = r.status;
      if (!r.ok) break;
      tried++;
      const data = await r.json();
      found = (data.items || []).find(i => i.type === type) || null;
    }
    if (status === 401 || status === 403) break;
  }

  if (status === 401) {
    say('Вход просрочен.<br><br><a class="kid-btn" href="/static/pages/login.html?next=' +
        encodeURIComponent(location.pathname + location.search) + '">Войти заново</a>');
    return;
  }
  if (status === 403) { say('Тема ' + theme + ' закрыта для этого пользователя. Нужен админский вход.'); return; }
  if (status === 404) { say('Темы ' + theme + ' не существует.'); return; }
  if (!found) {
    say('Задание типа «' + type + '» в теме ' + theme + ' не встретилось за ' + tried +
        ' прогонов. Формат либо не подключён к этой теме, либо ему не хватает данных.');
    return;
  }

  window.__item = found;
  // НЕ трогаем localStorage: раньше просмотр формата гасил демо навсегда,
  // и ребёнок на этом же планшете больше никогда его не видел
  window.Lesson.RENDERERS[type](found, screen, () => {
    screen.appendChild(window.Lesson.el('div', 'instr', 'Задание завершено'));
  });
})();
</script>
</body>
</html>
