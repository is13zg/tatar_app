<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Тренировка — TT-Learn Kids</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
  <link rel="stylesheet" href="/static/kid.css?v=20260811h" />
  <style>
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .theme-card {
      background: var(--card); border: none; border-radius: 20px; padding: 14px 8px;
      box-shadow: var(--shadow); cursor: pointer; display: grid; gap: 4px; justify-items: center;
    }
    .theme-card .ic { font-size: 44px; line-height: 1.1; }
    .theme-card .tt { font-weight: 800; font-size: 16px; text-align: center; }
    .mistakes-card {
      width: 100%; margin-bottom: 14px; background: linear-gradient(120deg, #8b5cf6, #6d28d9);
      color: white; border: none; border-radius: 22px; padding: 16px; cursor: pointer;
      display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 0 rgba(0,0,0,.12);
      font-size: 20px; font-weight: 800; text-align: left;
    }
    .mistakes-card .big { font-size: 42px; }
    .hint { text-align: center; color: #6b7280; font-size: 14px; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="kid-wrap">
    <div class="kid-top">
      <button class="kid-back" onclick="location.href='/static/pages/home.html'">←</button>
      <div class="kid-chip">💪 Тренировка</div>
    </div>

    <button class="mistakes-card" onclick="location.href='/static/pages/lesson.html?review=mistakes'">
      <span class="big">💪</span>
      <span>Мои трудные слова<br /><small style="font-weight:600;opacity:.85;">потренируем то, где были ошибки</small></span>
    </button>

    <div class="hint">Или выбери тему для повторения:</div>
    <div class="kid-card">
      <div class="theme-grid" id="grid"></div>
    </div>
  </div>

  <script>
    function token() { return localStorage.getItem('token'); }
    if (!token()) location.href = '/static/pages/login.html';
    (async () => {
      const res = await fetch('/lesson/path', { headers: { 'Authorization': 'Bearer ' + token() } });
      if (res.status === 401) { location.href = '/static/pages/login.html'; return; }
      const d = await res.json();
      const grid = document.getElementById('grid');
      const open = d.units.filter(u => u.state !== 'locked' || d.is_admin);
      open.forEach(u => {
        const c = document.createElement('button'); c.className = 'theme-card';
        const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = u.icon_emoji || '📚';
        const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = u.title_ru;
        c.appendChild(ic); c.appendChild(tt);
        c.onclick = () => location.href = `/static/pages/lesson.html?review=${u.theme_id}`;
        grid.appendChild(c);
      });
      if (!open.length) {
        grid.innerHTML = '';
        const msg = document.createElement('div');
        msg.style.cssText = 'grid-column:1/-1;text-align:center;color:#6b7280;font-weight:700;padding:16px;';
        msg.textContent = 'Сначала пройди первый урок на карте!';
        grid.appendChild(msg);
      }
    })();
  </script>
</body>
</html>
