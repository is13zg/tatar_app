<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карта — TT-Learn Kids</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
  <link rel="stylesheet" href="/static/kid.css" />
</head>
<body>
  <div class="kid-wrap">
    <div class="kid-top">
      <button class="kid-back" onclick="location.href='/static/pages/home.html'">←</button>
      <div class="kid-chip">🗺️ Карта</div>
      <div class="spacer"></div>
      <div class="kid-chip" id="streak">🔥 0</div>
    </div>
    <div id="list"></div>
  </div>

  <div id="unit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;place-items:center;padding:20px;">
    <div class="kid-card" style="max-width:420px;width:100%;">
      <div style="text-align:center;">
        <div style="font-size:56px;" id="m-icon"></div>
        <div class="word-big" id="m-title"></div>
        <div class="word-small" id="m-tt"></div>
      </div>
      <div id="m-lessons" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;"></div>
      <button class="kid-btn ghost" style="margin-top:14px;" onclick="document.getElementById('unit-modal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <script src="/static/exercises.js"></script>
  <script>
    if (!localStorage.getItem('token')) location.href = '/static/pages/login.html';

    let adminMode = false;

    function openUnit(u) {
      const m = document.getElementById('unit-modal');
      document.getElementById('m-icon').textContent = u.icon_emoji;
      document.getElementById('m-title').textContent = u.title_ru + (adminMode ? ' 🔧' : '');
      document.getElementById('m-tt').textContent = u.title_tt || '';
      const box = document.getElementById('m-lessons');
      box.innerHTML = '';
      for (let i = 1; i <= u.lessons_total; i++) {
        const isBoss = i === u.lessons_total;
        const done = i <= u.lessons_done;
        const available = adminMode || i <= u.lessons_done + 1;
        const b = document.createElement('button');
        b.className = 'kid-btn' + (isBoss ? '' : ' secondary');
        b.style.cssText = 'font-size:20px;padding:14px 6px;' + (available ? '' : 'filter:grayscale(1);opacity:.5;');
        b.textContent = isBoss ? '👑' : (done ? '✅ ' + i : i);
        if (available) {
          b.onclick = () => location.href = `/static/pages/lesson.html?theme=${u.theme_id}&lesson=${i}`;
        } else {
          b.disabled = true;
          b.setAttribute('aria-disabled', 'true');
        }
        box.appendChild(b);
      }
      m.style.display = 'grid';
    }

    (async () => {
      const d = await Lesson.api('/lesson/path');
      adminMode = !!d.is_admin;
      document.getElementById('streak').textContent = adminMode ? '🔧 админ' : ('🔥 ' + d.streak);
      const list = document.getElementById('list');
      d.units.forEach(u => {
        const n = document.createElement('div');
        const locked = u.state === 'locked' && !adminMode;
        n.className = 'path-node ' + (locked ? 'locked' : (u.state === 'locked' ? '' : u.state));
        const mk = (tag, cls, text) => { const x = document.createElement(tag); x.className = cls; if (text !== undefined) x.textContent = text; return x; };
        n.appendChild(mk('div', 'node-icon', locked ? '🔒' : u.icon_emoji));
        const info = mk('div', 'node-info');
        info.appendChild(mk('div', 'node-title', u.title_ru));
        const plural = (n, one, few, many) => { const m = n % 100, d = n % 10; return (m > 10 && m < 20) ? many : (d === 1 ? one : (d >= 2 && d <= 4 ? few : many)); };
        info.appendChild(mk('div', 'node-sub', `${u.word_count} ${plural(u.word_count, 'слово', 'слова', 'слов')} · урок ${Math.min(u.lessons_done + 1, u.lessons_total)} из ${u.lessons_total}`));
        n.appendChild(info);
        n.appendChild(mk('div', 'node-stars', '⭐'.repeat(u.stars)));
        if (!locked) n.onclick = () => openUnit(u);
        list.appendChild(n);
      });
    })();
  </script>
</body>
</html>
