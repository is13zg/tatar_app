<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
  <link rel="stylesheet" href="/static/kid.css?v=20260812c" />
</head>
<body>
  <div class="kid-wrap" id="root"></div>
  <script src="/static/exercises.js?v=20260812c"></script>
  <script>
    if (!localStorage.getItem('token')) location.href = '/static/pages/login.html';
    const q = new URLSearchParams(location.search);
    const opts = q.get('daily')
      ? { daily: true, backUrl: '/static/pages/home.html' }
      : q.get('review')
        ? { review: q.get('review'), backUrl: '/static/pages/repeat.html' }
        : { themeId: Number(q.get('theme')), lessonNo: Number(q.get('lesson') || 1), backUrl: '/static/pages/path.html' };
    Lesson.run(document.getElementById('root'), opts);
  </script>
</body>
</html>
