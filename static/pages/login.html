<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — TT-Learn Kids</title>
  <style>
    :root { --maxw: 420px; }
    body { font-family: system-ui, sans-serif; margin: 0; }
    .center { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
    .card { width: 100%; max-width: var(--maxw); border: 1px solid #e5e7eb; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    h1 { margin: 0 0 16px; text-align: center; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    input { padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    button { padding: 12px; border: 0; background: #2563eb; color: white; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .6; }
    .link { text-align: center; margin-top: 12px; }
    a { color: #2563eb; text-decoration: none; }
    .msg { margin-top: 8px; color: #ef4444; min-height: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <div class="center">
    <div class="card">
      <h1>Вход</h1>
      <div class="field">
        <label for="login_username">Логин</label>
        <input id="login_username" placeholder="Логин" autocomplete="username" />
      </div>
      <div class="field">
        <label for="login_password">Пароль</label>
        <input id="login_password" type="password" placeholder="Пароль" autocomplete="current-password" />
      </div>
      <button id="btnLogin">Войти</button>
      <div class="msg" id="loginInfo"></div>
      <div class="link"><a href="/static/pages/register.html">Нет аккаунта? Зарегистрироваться</a></div>
    </div>
  </div>

  <script>
    document.getElementById('btnLogin').onclick = async () => {
      const username = document.getElementById('login_username').value.trim();
      const password = document.getElementById('login_password').value.trim();
      const info = document.getElementById('loginInfo');
      info.textContent = '';
      try {
        const body = new URLSearchParams({ username, password, grant_type: '' });
        const res = await fetch('/auth/login', { method: 'POST', body });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('username', username);
        window.location.href = '/static/pages/home.html';
      } catch (e) {
        info.textContent = 'Ошибка входа';
      }
    };
  </script>
</body>
</html>
