<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Статистика — TT-Learn Kids</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    nav { display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
    nav a { text-decoration: none; color: #2563eb; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .theme { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <nav>
    <a href="/static/pages/home.html">🏠 Главная</a>
    <a href="/static/pages/study.html">Изучение</a>
    <a href="/static/pages/repeat.html">Повторение</a>
    <a href="/static/pages/mistakes.html">Работа над ошибками</a>
    <a href="/static/pages/stats.html">Статистика</a>
  </nav>

  <div class="wrap">
    <div class="card" id="kid-progress"></div>
    <div class="card" id="overall"></div>
    <div class="card">
      <h3>По темам</h3>
      <div class="grid" id="themes"></div>
    </div>
    <div class="card">
      <h3>Топ 10 по выученным словам</h3>
      <div id="leaders"></div>
    </div>
  </div>

  <script>
    function token() { return localStorage.getItem('token'); }
    if (!token()) location.href = '/static/pages/login.html';
    const _lg = document.getElementById('logout'); if (_lg) _lg.onclick = () => { localStorage.removeItem('token'); localStorage.removeItem('username'); };

    // родительский гейт: страница со статистикой и «Выходом» — не для детских пальцев
    if (sessionStorage.getItem('parent_ok') !== '1') {
      const a = 3 + Math.floor(Math.random() * 6), b = 3 + Math.floor(Math.random() * 6);
      const right = a * b;
      const opts = [right, right + a, right - b].sort(() => Math.random() - 0.5);
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:linear-gradient(160deg,#fef6e4,#e0f2fe);display:grid;place-items:center;z-index:99;padding:20px;';
      const box = document.createElement('div');
      box.style.cssText = 'background:white;border-radius:24px;padding:26px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12);';
      box.innerHTML = '<div style="font-size:44px;">🔒</div><div style="font-weight:800;font-size:19px;margin:8px 0;">Страница для родителей</div>' +
        `<div style="font-size:17px;margin-bottom:14px;">Сколько будет <b>${a} × ${b}</b>?</div>`;
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:10px;justify-content:center;';
      opts.forEach(v => {
        const btn = document.createElement('button');
        btn.textContent = v;
        btn.style.cssText = 'flex:1;padding:14px;border:none;border-radius:14px;background:#ea580c;color:white;font-size:20px;font-weight:800;cursor:pointer;';
        btn.onclick = () => {
          if (v === right) { sessionStorage.setItem('parent_ok', '1'); ov.remove(); }
          else location.href = '/static/pages/home.html';
        };
        row.appendChild(btn);
      });
      box.appendChild(row);
      const back = document.createElement('button');
      back.textContent = '⬅ Назад';
      back.style.cssText = 'margin-top:12px;padding:10px 18px;border:none;border-radius:12px;background:#f1f5f9;font-size:15px;cursor:pointer;';
      back.onclick = () => location.href = '/static/pages/home.html';
      box.appendChild(back);
      ov.appendChild(box);
      document.addEventListener('DOMContentLoaded', () => document.body.appendChild(ov));
    }

    async function api(path) {
      const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token() } });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    (async () => {
      try {
        const h = await api('/lesson/home');
        const p = await api('/lesson/path');
        const done = p.units.filter(u => u.state === 'done').length;
        document.getElementById('kid-progress').innerHTML = `
          <h3 style="margin-top:0;">Путь ребёнка</h3>
          <div>🔥 <b>Серия дней:</b> ${h.streak}</div>
          <div>⭐ <b>Звёзды:</b> ${h.total_stars}</div>
          <div>🏅 <b>Наклейки:</b> ${h.stickers.join(' ') || 'пока нет'}</div>
          <div>📚 <b>Пройдено юнитов:</b> ${done} из ${p.units.length}</div>
          <div>🧠 <b>Слов в памяти (повторено ≥2 раз):</b> ${h.learned_words}</div>
          <div>${h.daily_done ? '✅ Задание дня выполнено' : '⬜ Задание дня ещё не сделано'}</div>`;
      } catch (e) {}
      const s = await api('/stats');
      const overall = document.getElementById('overall');
      overall.innerHTML = `
        <div><b>Всего слов:</b> ${s.total_words}</div>
        <div><b>Выучено:</b> ${s.learned_words}</div>
        <div><b>Ошибок всего:</b> ${s.mistakes_total}</div>
        <div><b>Пользователей всего:</b> ${s.total_users}</div>
        <div class="muted">Последнее обновление: сейчас</div>
      `;
      const cont = document.getElementById('themes');
      s.themes.forEach(t => {
        const el = document.createElement('div'); el.className = 'theme';
        el.innerHTML = `<div><b>${t.title_ru}</b></div>
          <div>Всего: ${t.total_words}</div>
          <div>Выучено: ${t.learned_words}</div>
          <div>Ошибок: ${t.mistakes}</div>`;
        cont.appendChild(el);
      });
      const leaders = document.getElementById('leaders');
      leaders.innerHTML = s.leaderboard.map((r, i) => `${i+1}. ${r.username} — ${r.learned}`).join('<br/>');
    })();
  </script>
</body>
</html>
