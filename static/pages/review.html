<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Проверка слов — TT-Learn Kids</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦊</text></svg>" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: white; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
    header a { color: #2563eb; text-decoration: none; }
    h1 { font-size: 18px; margin: 0; }
    select, input[type="search"] { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 12px; }
    .row { display: flex; gap: 12px; align-items: center; background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .thumb { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #fff7ed; display: grid; place-items: center; font-size: 44px; flex: none; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .wtext { min-width: 160px; flex: 1; }
    .tt { font-size: 20px; font-weight: 700; }
    .ru { color: #6b7280; font-size: 14px; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #4338ca; white-space: nowrap; }
    .badge.rec { background: #fef3c7; color: #92400e; }
    button { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; background: #e2e8f0; }
    button.play { background: #8b5cf6; color: white; font-size: 18px; width: 44px; height: 44px; border-radius: 50%; flex: none; }
    button.voice { background: #ecfdf5; color: #065f46; }
    button:disabled { opacity: .5; }
    label.up { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; background: #e2e8f0; }
    label.up input { display: none; }
    .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .count { color: #6b7280; font-size: 14px; margin: 8px 0; }
    .flash { animation: flash 1s; }
    @keyframes flash { 0% { background: #dcfce7; } 100% { background: white; } }
  </style>
</head>
<body>
  <header>
    <a href="/static/pages/admin.html">← Админка</a>
    <h1>🔎 Проверка слов</h1>
    <select id="theme"></select>
    <input id="search" type="search" placeholder="Поиск: слово или перевод" />
    <select id="filter">
      <option value="">Все слова</option>
      <option value="noimg">Без картинки</option>
      <option value="rec">Своя запись 🎙</option>
      <option value="tts">Озвучка TTS 🤖</option>
      <option value="flagged">🚩 Помеченные картинки</option>
    </select>
  </header>

  <div class="wrap">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

  <audio id="player"></audio>
  <script>
    function token() { return localStorage.getItem('token'); }
    if (!token()) location.href = '/static/pages/login.html';
    fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + token() } })
      .then(r => r.ok ? r.json() : null)
      .then(me => { if (!me || !me.is_admin) location.href = '/static/pages/home.html'; })
      .catch(() => {});

    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { 'Authorization': 'Bearer ' + token(), ...(opts.headers || {}) } });
      const ct = res.headers.get('content-type') || '';
      const data = ct.includes('json') ? await res.json() : await res.text();
      if (!res.ok) throw new Error((data && data.detail) || 'Ошибка');
      return data;
    }

    const player = document.getElementById('player');
    function play(url) {
      if (!url) return;
      try { player.pause(); player.currentTime = 0; } catch (e) {}
      player.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(); // не брать из кэша после замены
      player.play().catch(() => {});
    }

    let themes = [], words = [];

    function rowHtml(w) {
      const hasImg = w.image_url && !w.image_url.includes('noimg');
      const audio = w.audio_url || w.tts_url;
      const isRec = !!w.audio_url;
      return { hasImg, audio, isRec };
    }

    function render() {
      const q = (document.getElementById('search').value || '').toLowerCase();
      const f = document.getElementById('filter').value;
      const list = document.getElementById('list');
      list.innerHTML = '';
      let shown = 0;
      words.forEach(w => {
        const { hasImg, audio, isRec } = rowHtml(w);
        if (q && !(w.text_tt.toLowerCase().includes(q) || w.text_ru.toLowerCase().includes(q))) return;
        if (f === 'noimg' && hasImg) return;
        if (f === 'rec' && !isRec) return;
        if (f === 'tts' && isRec) return;
        if (f === 'flagged' && !w.image_flag) return;
        shown++;

        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.wid = w.id;

        const thumb = document.createElement('div'); thumb.className = 'thumb';
        if (hasImg) { const img = document.createElement('img'); img.src = w.image_url + '?v=' + Date.now(); thumb.appendChild(img); }
        else thumb.textContent = w.emoji || '❓';
        row.appendChild(thumb);

        const wt = document.createElement('div'); wt.className = 'wtext';
        const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = w.text_tt;
        const ru = document.createElement('div'); ru.className = 'ru'; ru.textContent = w.text_ru;
        wt.appendChild(tt); wt.appendChild(ru); row.appendChild(wt);

        const badge = document.createElement('span');
        badge.className = 'badge' + (isRec ? ' rec' : '');
        badge.textContent = audio ? (isRec ? '🎙 запись' : '🤖 TTS') : '🔇 нет звука';
        row.appendChild(badge);

        const actions = document.createElement('div'); actions.className = 'actions';

        const playBtn = document.createElement('button'); playBtn.className = 'play'; playBtn.textContent = '▶';
        playBtn.disabled = !audio;
        playBtn.onclick = () => play(audio);
        actions.appendChild(playBtn);

        const mkVoice = (voice, label) => {
          const b = document.createElement('button'); b.className = 'voice'; b.textContent = label;
          b.onclick = async () => {
            b.disabled = true; b.textContent = '…';
            try {
              const r = await api(`/admin/tts_word/${w.id}?voice=${voice}`, { method: 'POST' });
              w.tts_url = r.tts_url; w.audio_url = null;
              render();
              play(r.tts_url);
            } catch (e) { alert(e.message); b.disabled = false; b.textContent = label; }
          };
          return b;
        };
        actions.appendChild(mkVoice('alsu', '🔁 Алсу'));
        actions.appendChild(mkVoice('almaz', '🔁 Алмаз'));

        const upA = document.createElement('label'); upA.className = 'up'; upA.textContent = '📤 звук';
        const finA = document.createElement('input'); finA.type = 'file'; finA.accept = 'audio/*';
        finA.onchange = async () => {
          if (!finA.files[0]) return;
          const fd = new FormData(); fd.append('file', finA.files[0]);
          try {
            const r = await api(`/admin/word_audio/${w.id}`, { method: 'POST', body: fd });
            w.audio_url = r.audio_url;
            render();
            play(r.audio_url);
          } catch (e) { alert(e.message); }
        };
        upA.appendChild(finA); actions.appendChild(upA);

        // запись собственного голоса с обработкой (шумоподавление/обрезка тишины/нормализация)
        const recBtn = document.createElement('button'); recBtn.textContent = '🎙 записать';
        recBtn.style.background = '#fee2e2';
        recBtn.onclick = () => startRecording(w, row, recBtn);
        actions.appendChild(recBtn);

        const upI = document.createElement('label'); upI.className = 'up'; upI.textContent = '🖼 картинка';
        const finI = document.createElement('input'); finI.type = 'file'; finI.accept = 'image/*';
        finI.onchange = async () => {
          if (!finI.files[0]) return;
          const fd = new FormData(); fd.append('file', finI.files[0]);
          try {
            const r = await api(`/admin/word_image/${w.id}`, { method: 'POST', body: fd });
            w.image_url = r.image_url; w.image_flag = 0;
            api(`/admin/word_flag/${w.id}?flagged=false`, { method: 'POST' }).catch(() => {});
            render();
          } catch (e) { alert(e.message); }
        };
        upI.appendChild(finI); actions.appendChild(upI);

        const flagBtn = document.createElement('button');
        flagBtn.textContent = w.image_flag ? '🚩 помечена' : '🏳 пометить';
        flagBtn.style.background = w.image_flag ? '#fecaca' : '#e2e8f0';
        flagBtn.title = 'Пометить картинку как неудачную (для замены)';
        flagBtn.onclick = async () => {
          try {
            const r = await api(`/admin/word_flag/${w.id}?flagged=${w.image_flag ? 'false' : 'true'}`, { method: 'POST' });
            w.image_flag = r.image_flag;
            render();
          } catch (e) { alert(e.message); }
        };
        actions.appendChild(flagBtn);

        row.appendChild(actions);

        // блок предложения
        const sbox = document.createElement('div');
        sbox.style.cssText = 'width:100%;display:flex;gap:8px;align-items:center;background:#fffbeb;border-radius:8px;padding:6px 10px;font-size:14px;flex-wrap:wrap;';
        const stxt = document.createElement('div'); stxt.style.flex = '1';
        if (w.sentence_tt) {
          stxt.innerHTML = '';
          const t1 = document.createElement('b'); t1.textContent = w.sentence_tt;
          const t2 = document.createElement('span'); t2.textContent = ' — ' + (w.sentence_ru || '');
          t2.style.color = '#92400e';
          stxt.appendChild(t1); stxt.appendChild(t2);
        } else {
          stxt.textContent = 'Предложения нет';
          stxt.style.color = '#9ca3af';
        }
        sbox.appendChild(stxt);
        if (w.sentence_tt) {
          const sp = document.createElement('button'); sp.textContent = '▶'; sp.style.cssText = 'padding:4px 10px;';
          sp.disabled = !w.sentence_audio_url;
          sp.onclick = () => play(w.sentence_audio_url);
          sbox.appendChild(sp);
          const sv = document.createElement('button'); sv.textContent = '🔁 озвучить'; sv.style.cssText = 'padding:4px 10px;background:#ecfdf5;';
          sv.onclick = async () => {
            sv.disabled = true; sv.textContent = '…';
            try {
              const r = await api(`/admin/tts_sentence/${w.id}?voice=alsu`, { method: 'POST' });
              w.sentence_audio_url = r.sentence_audio_url; render(); play(r.sentence_audio_url);
            } catch (e) { alert(e.message); sv.disabled = false; sv.textContent = '🔁 озвучить'; }
          };
          sbox.appendChild(sv);
        }
        const se = document.createElement('button'); se.textContent = '✏️'; se.style.cssText = 'padding:4px 10px;';
        se.onclick = async () => {
          const tt = prompt('Татарское предложение (пусто = убрать):', w.sentence_tt || '');
          if (tt === null) return;
          const ru = tt ? (prompt('Русский перевод:', w.sentence_ru || '') ?? '') : '';
          try {
            const r = await api(`/admin/sentence/${w.id}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sentence_tt: tt, sentence_ru: ru }),
            });
            w.sentence_tt = r.sentence_tt; w.sentence_ru = r.sentence_ru; w.sentence_audio_url = r.sentence_audio_url;
            render();
            if (r.sentence_audio_url) play(r.sentence_audio_url);
          } catch (e) { alert(e.message); }
        };
        sbox.appendChild(se);
        row.appendChild(sbox);

        list.appendChild(row);
      });
      document.getElementById('count').textContent = `Показано слов: ${shown} из ${words.length}`;
    }

    // ---------- запись голоса с минимальной обработкой ----------
    // цепочка: браузерное шумоподавление (noiseSuppression) → high-pass 80 Гц (гул) →
    // обрезка тишины по краям → нормализация пика → WAV 22050 Гц (как у TTS)

    function encodeWav(samples, rate) {
      const buf = new ArrayBuffer(44 + samples.length * 2);
      const v = new DataView(buf);
      const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      ws(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); ws(8, 'WAVE');
      ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      ws(36, 'data'); v.setUint32(40, samples.length * 2, true);
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return new Blob([buf], { type: 'audio/wav' });
    }

    async function processRecording(blob) {
      const RATE = 22050;
      const raw = await blob.arrayBuffer();
      const probe = new AudioContext();
      const decoded = await probe.decodeAudioData(raw);
      probe.close();
      // high-pass + ресемплинг в OfflineAudioContext
      const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * RATE), RATE);
      const src = off.createBufferSource(); src.buffer = decoded;
      const hp = off.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 80;
      src.connect(hp); hp.connect(off.destination); src.start();
      const rendered = await off.startRendering();
      let data = rendered.getChannelData(0);

      // --- агрессивная обрезка пауз: энергия (RMS) по окнам 20 мс + оценка уровня шума ---
      const WIN = Math.floor(0.02 * RATE);
      const nWin = Math.floor(data.length / WIN);
      if (nWin < 3) throw new Error('Слишком короткая запись');
      const rms = new Float32Array(nWin);
      for (let wI = 0; wI < nWin; wI++) {
        let s = 0;
        for (let i = wI * WIN; i < (wI + 1) * WIN; i++) s += data[i] * data[i];
        rms[wI] = Math.sqrt(s / WIN);
      }
      const sorted = [...rms].sort((a, b) => a - b);
      const noiseFloor = sorted[Math.floor(nWin * 0.1)];       // 10-й перцентиль = фон
      const peakRms = sorted[nWin - 1];
      if (peakRms < 0.01) throw new Error('Слишком тихо — попробуйте ещё раз ближе к микрофону');
      // речь = заметно громче фона И не совсем шёпот относительно пика
      const thr = Math.max(noiseFloor * 3, peakRms * 0.08);
      let wa = 0, wb = nWin - 1;
      while (wa < wb && rms[wa] < thr) wa++;
      while (wb > wa && rms[wb] < thr) wb--;
      // паддинг: 80 мс до начала речи, 140 мс после (естественное затухание)
      let a = Math.max(0, wa * WIN - Math.floor(0.08 * RATE));
      let b = Math.min(data.length - 1, (wb + 1) * WIN + Math.floor(0.14 * RATE));
      data = data.slice(a, b + 1);

      // нормализация пика до 0.89 + фейды 8 мс от щелчков
      let p2 = 0;
      for (let i = 0; i < data.length; i++) p2 = Math.max(p2, Math.abs(data[i]));
      const gain = p2 > 0 ? 0.89 / p2 : 1;
      const out = new Float32Array(data.length);
      for (let i = 0; i < data.length; i++) out[i] = data[i] * gain;
      const FADE = Math.min(Math.floor(0.008 * RATE), Math.floor(out.length / 4));
      for (let i = 0; i < FADE; i++) {
        out[i] *= i / FADE;
        out[out.length - 1 - i] *= i / FADE;
      }
      return encodeWav(out, RATE);
    }
    window.__processRecording = processRecording; // для автотеста

    async function startRecording(w, row, btn) {
      if (!window.isSecureContext || !navigator.mediaDevices) {
        alert('Запись работает только на https-версии: https://62.113.108.107:8443');
        return;
      }
      if (btn.dataset.rec === '1') { window.__stopRec && window.__stopRec(); return; }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true, channelCount: 1 },
        });
      } catch (e) { alert('Микрофон недоступен: ' + e.name); return; }
      const rec = new MediaRecorder(stream);
      const chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      btn.dataset.rec = '1'; btn.textContent = '⏹ стоп'; btn.style.background = '#fecaca';
      const stop = () => { if (rec.state === 'recording') rec.stop(); };
      window.__stopRec = stop;
      const autoStop = setTimeout(stop, 5000);
      rec.onstop = async () => {
        clearTimeout(autoStop);
        stream.getTracks().forEach(t => t.stop());
        btn.dataset.rec = ''; btn.textContent = '🎙 записать'; btn.style.background = '#fee2e2';
        let wav;
        try {
          wav = await processRecording(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }));
        } catch (e) { alert(e.message); return; }
        // предпрослушка + сохранить/отмена
        const url = URL.createObjectURL(wav);
        const bar = document.createElement('div');
        bar.style.cssText = 'display:flex;gap:6px;align-items:center;width:100%;margin-top:6px;';
        const pv = document.createElement('button'); pv.className = 'play'; pv.textContent = '▶';
        pv.onclick = () => { const A = new Audio(url); A.play(); };
        const save = document.createElement('button'); save.textContent = '💾 сохранить';
        save.style.background = '#dcfce7';
        save.onclick = async () => {
          const fd = new FormData(); fd.append('file', wav, `word_${w.id}.wav`);
          try {
            const r = await api(`/admin/word_audio/${w.id}`, { method: 'POST', body: fd });
            w.audio_url = r.audio_url;
            URL.revokeObjectURL(url);
            render();
            play(r.audio_url);
          } catch (e) { alert(e.message); }
        };
        const cancel = document.createElement('button'); cancel.textContent = '✖';
        cancel.onclick = () => { URL.revokeObjectURL(url); bar.remove(); };
        bar.appendChild(pv); bar.appendChild(save); bar.appendChild(cancel);
        row.appendChild(bar);
        pv.click(); // сразу дать послушать результат
      };
      rec.start();
    }

    async function loadWords() {
      const themeId = document.getElementById('theme').value;
      words = await api(`/themes/${themeId}/words`);
      render();
    }

    (async () => {
      themes = await api('/themes');
      const sel = document.getElementById('theme');
      themes.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id; o.textContent = `${t.icon_emoji || ''} ${t.title_ru}`;
        sel.appendChild(o);
      });
      sel.onchange = loadWords;
      document.getElementById('search').oninput = render;
      document.getElementById('filter').onchange = render;
      if (themes.length) await loadWords();
    })();
  </script>
</body>
</html>
